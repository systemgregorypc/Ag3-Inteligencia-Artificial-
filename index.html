<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG3 IA Code — Entorno de Desarrollo Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #070b14; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { height: 50px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .logo { font-size: 1rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .logo span { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .status-bar { font-size: 0.8rem; color: #10b981; display: flex; align-items: center; gap: 6px; }

        .workspace { flex: 1; display: grid; grid-template-columns: 320px 6px 1fr 6px 1fr; height: calc(100vh - 50px); overflow: hidden; background: #0b0f19; }
        .resizer { background: #1e293b; cursor: col-resize; transition: background 0.2s; }
        .resizer:hover, .resizer.active { background: #38bdf8; }

        .ai-panel { background: #0f172a; display: flex; flex-direction: column; overflow: hidden; }
        .ai-header { padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; }
        .ai-header select { background: #070b14; color: #38bdf8; border: 1px solid #475569; padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; }
        .ai-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
        .msg { padding: 8px 12px; border-radius: 6px; line-height: 1.4; word-break: break-word; }
        .msg.user { background: #1e293b; color: #38bdf8; }
        .msg.ai { background: #111827; color: #e2e8f0; border-left: 3px solid #38bdf8; font-family: 'Courier New', monospace; font-size: 0.8rem; }
        .ai-input-area { padding: 10px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; }
        .ai-input-area textarea { background: #070b14; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 4px; resize: none; height: 60px; font-size: 0.85rem; outline: none; }
        .ai-input-area textarea:focus { border-color: #38bdf8; }
        .btn-run { background: #38bdf8; color: #000; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 0.85rem; }
        .btn-run:hover { background: #7dd3fc; }
        .btn-run:disabled { background: #475569; cursor: not-allowed; }

        .code-container-col { display: flex; flex-direction: column; background: #090d16; overflow: hidden; }
        .editor-toolbar { padding: 8px 15px; background: #0f172a; border-bottom: 1px solid #1e293b; font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        .editor-wrapper { flex: 1; display: flex; overflow: auto; position: relative; font-family: 'Courier New', Courier, monospace; }
        .line-numbers { width: 50px; background: #070a12; color: #475569; padding: 10px 5px; text-align: right; font-size: 0.85rem; line-height: 1.5; user-select: none; border-right: 1px solid #1e293b; }
        #codeEditor { flex: 1; background: transparent; color: #34d399; border: none; padding: 10px; font-size: 0.85rem; line-height: 1.5; resize: none; outline: none; white-space: pre; overflow-x: auto; font-family: 'Courier New', Courier, monospace; }

        .preview-panel { display: flex; flex-direction: column; background: #ffffff; overflow: hidden; }
        .preview-header { padding: 8px 15px; background: #e2e8f0; color: #1e293b; font-size: 0.8rem; font-weight: bold; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
        .btn-action { background: #cbd5e1; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; color: #1e293b; }
        .btn-action:hover { background: #94a3b8; }
        #livePreview { flex: 1; border: none; width: 100%; height: 100%; }
        
        /* Consola técnica estándar y modo Mainframe COBOL */
        #codeConsole { flex: 1; background: #0b0f19; color: #38bdf8; padding: 15px; font-family: 'Courier New', monospace; font-size: 0.85rem; overflow: auto; display: none; white-space: pre; line-height: 1.5; }
        #codeConsole.cobol-mode { background: #020a02; color: #33ff33; text-shadow: 0 0 4px rgba(51, 255, 51, 0.4); border-top: 2px solid #14532d; }
    </style>
</head>
<body>

    <header>
        <div class="logo">💻 AG3 IA Code <span>Pro IDE 2026</span></div>
        <div class="status-bar"><span style="width:8px; height:8px; background:#10b981; border-radius:50%; display:inline-block;"></span> IA Generativa Activa</div>
    </header>

    <div class="workspace" id="workspace">
        <div class="ai-panel">
            <div class="ai-header">
                <span style="font-size:0.75rem; color:#94a3b8; font-weight:bold;">LENGUAJE DE COMPILACIÓN IA:</span>
                <select id="langSelect">
                    <option value="html">HTML / CSS / JS (Web)</option>
                    <option value="cobol">COBOL (Mainframe / Clásico)</option>
                    <option value="python">Python (Backend)</option>
                    <option value="worker">Cloudflare Worker</option>
                    <option value="web3">Solidity / Web3 (Token A1X)</option>
                </select>
            </div>
            <div class="ai-messages" id="aiMessages">
                <div class="msg ai">AG3 IA lista. Describe con tus palabras lo que deseas programar en HTML, COBOL, Python, Workers o Web3 y la IA escribirá el código fuente.</div>
            </div>
            <div class="ai-input-area">
                <textarea id="promptInput" placeholder="Ej: Calcula la nómina de un empleado con horas extras..."></textarea>
                <button class="btn-run" id="sendBtn">Programar con IA</button>
            </div>
        </div>

        <div class="resizer" id="resizer1"></div>

        <div class="code-container-col">
            <div class="editor-toolbar">
                <span>📄 Editor Fuente</span>
                <span id="lineCount">Líneas: 1</span>
            </div>
            <div class="editor-wrapper">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea id="codeEditor" spellcheck="false" placeholder="El código generado por la IA aparecerá aquí..."></textarea>
            </div>
        </div>

        <div class="resizer" id="resizer2"></div>

        <div class="preview-panel">
            <div class="preview-header">
                <span id="previewTitle">🖥️ Vista Previa en Vivo (Sandbox)</span>
                <button class="btn-action" onclick="copiarCodigo()">Copiar Código</button>
            </div>
            <iframe id="livePreview" srcdoc="<h3 style='font-family:sans-serif; text-align:center; margin-top:50px; color:#64748b;'>El visor web o terminal Mainframe se mostrará aquí.</h3>"></iframe>
            <div id="codeConsole"></div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiMessages = document.getElementById('aiMessages');
        const codeEditor = document.getElementById('codeEditor');
        const lineNumbers = document.getElementById('lineNumbers');
        const lineCount = document.getElementById('lineCount');
        const livePreview = document.getElementById('livePreview');
        const codeConsole = document.getElementById('codeConsole');
        const previewTitle = document.getElementById('previewTitle');
        const langSelect = document.getElementById('langSelect');

        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            let numbersStr = '';
            for (let i = 1; i <= Math.max(lines, 1); i++) { numbersStr += i + '\n'; }
            lineNumbers.textContent = numbersStr;
            lineCount.textContent = `Líneas: ${lines}`;
        }

        codeEditor.addEventListener('input', () => {
            updateLineNumbers();
            if (langSelect.value === 'html') {
                livePreview.srcdoc = codeEditor.value;
            } else {
                codeConsole.textContent = codeEditor.value;
            }
        });
        codeEditor.addEventListener('scroll', () => { lineNumbers.scrollTop = codeEditor.scrollTop; });

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            aiMessages.appendChild(div);
            aiMessages.scrollTop = aiMessages.scrollHeight;
        }

        function copiarCodigo() {
            navigator.clipboard.writeText(codeEditor.value);
            alert('¡Código copiado al portapapeles!');
        }

        async function handleGenerate() {
            const text = promptInput.value.trim();
            const selectedLang = langSelect.value;
            if (!text || sendBtn.disabled) return;

            appendMsg('user', text);
            promptInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = 'IA Programando...';

            try {
                const response = await fetch('https://ag3-code-api.genesis-ia.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, language: selectedLang })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    codeEditor.value = data.code;
                    updateLineNumbers();
                    codeConsole.classList.remove('cobol-mode');

                    if (selectedLang === 'html') {
                        livePreview.style.display = 'block';
                        codeConsole.style.display = 'none';
                        previewTitle.textContent = "🖥️ Vista Previa en Vivo (Sandbox)";
                        livePreview.srcdoc = data.code;
                    } else if (selectedLang === 'cobol') {
                        livePreview.style.display = 'none';
                        codeConsole.style.display = 'block';
                        codeConsole.classList.add('cobol-mode');
                        previewTitle.textContent = "📟 Terminal IBM Mainframe — COBOL";
                        codeConsole.textContent = data.code;
                    } else {
                        livePreview.style.display = 'none';
                        codeConsole.style.display = 'block';
                        previewTitle.textContent = `⚙️ Consola Técnica (${selectedLang.toUpperCase()})`;
                        codeConsole.textContent = data.code;
                    }

                    appendMsg('ai', `✅ Código en ${selectedLang.toUpperCase()} generado por la IA.`);
                } else {
                    appendMsg('ai', '❌ ' + (data.error || 'No se pudo procesar la orden.'));
                }
            } catch (err) {
                appendMsg('ai', '❌ Error de conexión: ' + err.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Programar con IA';
            }
        }

        sendBtn.addEventListener('click', handleGenerate);
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleGenerate(); }
        });

        const workspace = document.getElementById('workspace');
        const resizer1 = document.getElementById('resizer1');
        const resizer2 = document.getElementById('resizer2');
        let activeResizer = null;

        resizer1.addEventListener('mousedown', (e) => { activeResizer = 1; e.preventDefault(); });
        resizer2.addEventListener('mousedown', (e) => { activeResizer = 2; e.preventDefault(); });

        window.addEventListener('mousemove', (e) => {
            if (!activeResizer) return;
            const rect = workspace.getBoundingClientRect();
            const x = e.clientX - rect.left;

            if (activeResizer === 1) {
                const width1 = Math.max(220, Math.min(x, 500));
                const remaining = rect.width - width1 - 12;
                const width2 = Math.max(300, remaining / 2);
                const width3 = remaining - width2;
                workspace.style.gridTemplateColumns = `${width1}px 6px ${width2}px 6px ${width3}px`;
            } else if (activeResizer === 2) {
                const leftPart = rect.left + 320 + 6;
                const w2 = Math.max(250, e.clientX - leftPart);
                workspace.style.gridTemplateColumns = `320px 6px ${w2}px 6px 1fr`;
            }
        });

        window.addEventListener('mouseup', () => { activeResizer = null; });
        updateLineNumbers();
    </script>
</body>
</html>
