<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG3 IA Code — Entorno de Programación | Génesis AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #070b14;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.2rem;
            color: #00f2fe;
            letter-spacing: 1px;
        }

        .logo-area span {
            font-size: 0.75rem;
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #00f2fe;
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            background: rgba(10, 15, 28, 0.95);
            border-right: 1px solid #1e293b;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-header select {
            background: #070b14;
            color: #00f2fe;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.ai {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(0, 242, 254, 0.2);
            align-self: flex-start;
            color: #e2e8f0;
        }

        .message.user {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            align-self: flex-end;
            font-weight: 500;
        }

        .chat-input-area {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
        }

        .chat-input-area textarea {
            flex: 1;
            background: #070b14;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.9rem;
            resize: none;
            height: 45px;
            outline: none;
        }

        .chat-input-area textarea:focus {
            border-color: #00f2fe;
        }

        .btn-send {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-send:hover {
            transform: scale(1.05);
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            background: #050811;
        }

        .preview-toolbar {
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-toolbar span {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .btn-action {
            background: #1e293b;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: rgba(0, 242, 254, 0.15);
        }

        #livePreview {
            flex: 1;
            border: none;
            background: #ffffff;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>AG3 IA Code</h1>
            <span>Núcleo Pro 2019–2026</span>
        </div>
        <div class="nav-links">
            <a href="https://genesis-ai.org/">Génesis AI</a>
            <a href="https://genesis-ai.org/planes">Planes ($2 USD)</a>
        </div>
    </header>

    <div class="workspace">
        <div class="chat-panel">
            <div class="chat-header">
                <select id="langSelect">
                    <option value="html">HTML / CSS / JS (Web)</option>
                    <option value="python">Python (Lógica / Backend)</option>
                    <option value="worker">Cloudflare Worker / D1</option>
                    <option value="web3">Solidity / Web3 / Token A1X</option>
                </select>
                <span id="statusIndicator" style="font-size: 0.8rem; color: #10b981;">● Motor Activo</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    Saludos, José Gregorio. Escribe una orden y probaremos la conexión en vivo.
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Escribe tu orden aquí..." rows="1"></textarea>
                <button class="btn-send" id="sendBtn">Enviar</button>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-toolbar">
                <span>🖥️ Visor en Vivo (Sandbox)</span>
                <button class="btn-action" onclick="alert('Visor activo')">Estado</button>
            </div>
            <iframe id="livePreview" srcdoc="<h3>Visor en espera...</h3>"></iframe>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const livePreview = document.getElementById('livePreview');
        const langSelect = document.getElementById('langSelect');
        const statusIndicator = document.getElementById('statusIndicator');

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerHTML = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        async function handleSend() {
            const promptText = userInput.value.trim();
            const selectedLang = langSelect.value;
            if (!promptText) return;

            appendMessage('user', promptText);
            userInput.value = '';

            const loadingBubble = appendMessage('ai', '⏳ Conectando con el Worker...');
            statusIndicator.textContent = "● Enviando...";
            statusIndicator.style.color = "#f59e0b";

            try {
                // Timeout de 15 segundos para detectar si el servidor no responde
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch('https://ag3-code-api.genesis-ia.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptText,
                        language: selectedLang
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const rawText = await response.text();
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("Respuesta no válida del servidor (HTML o texto plano): " + rawText.substring(0, 100));
                }

                if (response.ok && data.success) {
                    loadingBubble.innerHTML = `✅ Código generado:<br><pre style="background:#070b14;padding:8px;margin-top:5px;font-size:0.75rem;color:#34d399;max-height:150px;overflow:auto;"><code>${escapeHtml(data.code)}</code></pre>`;
                    livePreview.srcdoc = data.code;
                } else {
                    loadingBubble.innerHTML = `<span style="color:#f87171;">❌ Error del servidor: ${data.error || rawText}</span>`;
                }

            } catch (err) {
                if (err.name === 'AbortError') {
                    loadingBubble.innerHTML = `<span style="color:#f87171;">❌ Tiempo de espera agotado: El Worker tardó más de 15 segundos en responder (posible bloqueo de red o fallo en la IA).</span>`;
                } else {
                    loadingBubble.innerHTML = `<span style="color:#f87171;">❌ Error de conexión: ${err.message}</span>`;
                }
            } finally {
                statusIndicator.textContent = "● Motor Activo";
                statusIndicator.style.color = "#10b981";
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
